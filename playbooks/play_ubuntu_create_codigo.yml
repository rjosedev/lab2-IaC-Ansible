# Playbook para generar codigo utilizando templates Jinja2

# ansible-playbook -i inventario.yml ./playbooks/play_create_codigo.yml --ask-vault-pass --tags sub-folder

# ansible-playbook -i inventario.yml ./playbooks/play_create_codigo.yml --ask-vault-pass --tags int_access

# ansible-playbook -i inventario.yml ./playbooks/play_create_codigo.yml --ask-vault-pass --tags services,vlans

# ansible-playbook -i inventario.yml ./playbooks/play_create_codigo.yml --ask-vault-pass --skip-tags sub-folder

---
- name: Generar sub-folders para guardar el codigo generado
  hosts: "{{ modelo.hosts_groups.rt_all }}, {{ modelo.hosts_groups.sw_all }}, {{ modelo.hosts_groups.srv_ubuntu }}"
  gather_facts: false

  vars_files:
    - ../modelo_datos/modelo.yml

  tasks:
    - name: Create destination directory if it does not exist
      ansible.builtin.file:
        path: "{{ playbook_dir }}/{{ item.dest }}/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      loop:
        - {type: cfg, dest: "../configs", ext: cfg, orden: ""}
        - {type: doc, dest: "../doc/modulos", ext: md, orden: "1.1"}
  tags:
    - sub-folder

- name: Generar codigo desde templates Jinja2 para interfaces UBUNTU
  hosts: "{{ modelo.hosts_groups.srv_ubuntu }}"
  gather_facts: false

  vars_files:
    - ../modelo_datos/modelo.yml

  tasks:
    - name: Defincion de variables locales
      ansible.builtin.set_fact:
        interfaces: "{{ modelo.infra_spec.devices[inventory_hostname].interfaces }}"

    - name: Renderizar template Jinja2 para configurarcion de interfaces UBUNTU
      ansible.builtin.template:
        src: "{{ playbook_dir }}/roles/int_ubuntu/templates/int_ubuntu_{{ item.type }}.j2"
        dest: "{{ playbook_dir }}/{{ item.dest }}/{{ inventory_hostname }}/{{ item.orden }}{{ inventory_hostname }}_int_ubuntu.{{ item.ext }}"
        mode: "0644"
      register: int_ubuntu_result
      loop:
        - {type: cfg, dest: "../configs", ext: cfg, orden: ""}
        - {type: doc, dest: "../doc/modulos", ext: md, orden: "1.1"}

    - name: Mostrar resultado de la generacion de configuracion de interfaces de UBUNTU
      ansible.builtin.debug:
        var: int_ubuntu_result
  tags:
    - int_ubuntu

