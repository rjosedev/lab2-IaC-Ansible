---
- name: Defincion de variables locales
  ansible.builtin.set_fact:
    ospf: "{{ modelo.infra_spec.devices[inventory_hostname].ospf }}"

- name: Renderizar template Jinja2 para configurarcion de OSPF
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/rt_ospf/templates/rt_ospf_{{ item.type }}.j2"
    dest: "{{ playbook_dir }}/{{ item.dest }}/{{ inventory_hostname }}/{{ item.orden }}{{ inventory_hostname }}_rt_ospf.{{ item.ext }}"
    mode: "0644"
  when: ospf is defined and ospf|length > 0
  register: ospf_result
  loop:
    - {type: cfg, dest: "../configs", ext: cfg, orden: ""}
    - {type: doc, dest: "../doc/modulos", ext: md, orden: "1.1"}

- name: Mostrar resultado de la generacion de configuracion de OSPF
  ansible.builtin.debug:
    var: ospf_result
  when: ospf is defined and ospf|length > 0