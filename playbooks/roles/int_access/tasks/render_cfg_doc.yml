---
- name: Defincion de variables locales
  ansible.builtin.set_fact:
    interfaces: "{{ modelo.infra_spec.devices[inventory_hostname].interfaces }}"

- name: Renderizar template Jinja2 para configurarcion de interfaces ACCESS
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/int_access/templates/int_access_{{ item.type }}.j2"
    dest: "{{ playbook_dir }}/{{ item.dest }}/{{ inventory_hostname }}/{{ item.orden }}{{ inventory_hostname }}_int_access.{{ item.ext }}"
    mode: "0644"
  register: int_access_result
  loop:
    - {type: cfg, dest: "../configs", ext: cfg, orden: ""}
    - {type: doc, dest: "../doc/modulos", ext: md, orden: "1.1"}

- name: Mostrar resultado de la generacion de configuracion de interfaces de ACCESS
  ansible.builtin.debug:
    var: int_access_result