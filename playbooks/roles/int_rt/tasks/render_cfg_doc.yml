---
- name: Defincion de variables locales
  ansible.builtin.set_fact:
    interfaces: "{{ modelo.infra_spec.devices[inventory_hostname].interfaces }}"

# To skip a task on a list of specific hosts
- name: Define list of hosts to skip
  ansible.builtin.set_fact:
    hosts_to_skip:
      - 'SWB-IT1'
      - 'SWB-IT2'

- name: Renderizar template Jinja2 para configurarcion de interfaces ROUTING
  ansible.builtin.template:
    src: "{{ playbook_dir }}/roles/int_rt/templates/int_rt_{{ item.type }}.j2"
    dest: "{{ playbook_dir }}/{{ item.dest }}/{{ inventory_hostname }}/{{ item.orden }}{{ inventory_hostname }}_int_rt.{{ item.ext }}"
    mode: "0644"
  when: inventory_hostname not in hosts_to_skip
  register: int_rt_result
  loop:
    - {type: cfg, dest: "../configs", ext: cfg, orden: ""}
    - {type: doc, dest: "../doc/modulos", ext: md, orden: "1.1"}

- name: Mostrar resultado de la generacion de configuracion de interfaces de ROUTING
  ansible.builtin.debug:
    var: int_rt_result
  when: inventory_hostname not in hosts_to_skip