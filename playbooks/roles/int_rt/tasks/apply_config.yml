---
- name: Check if a file exists
  ansible.builtin.stat:
    path: '{{ playbook_dir }}/../configs/{{ inventory_hostname }}/{{ inventory_hostname }}_int_rt.cfg'
  register: file_check

- name: Aplicar configuracion de interfaces ROUTING
  cisco.ios.ios_config:
    src: "{{ playbook_dir }}/../configs/{{ inventory_hostname }}/{{ inventory_hostname }}_int_rt.cfg"
  register: apply_rt_result
  notify: Guardar configuracion
  when: file_check.stat.exists