---
- name: Check if a file exists
  ansible.builtin.stat:
    path: '{{ playbook_dir }}/../configs/{{ inventory_hostname }}/{{ inventory_hostname }}_rt_eigrp.cfg'
  register: file_check

- name: Aplicar configuracion de IS-IS
  cisco.ios.ios_config:
    src: "{{ playbook_dir }}/../configs/{{ inventory_hostname }}/{{ inventory_hostname }}_rt_isis.cfg"
  register: apply_isis_result
  notify: Guardar configuracion
  when: file_check.stat.exists