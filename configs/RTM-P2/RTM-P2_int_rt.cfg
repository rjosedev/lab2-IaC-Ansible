!
interface Loopback0
  description ### Loopback0 for BGP Router ID ###
  ip address 10.0.0.32 255.255.255.255
  no shutdown
  ip router isis CORE
!
interface GigabitEthernet0/0
  description ### Link to RTM-P3 ###
  ip address 10.0.32.2 255.255.255.248
  no shutdown
  ip router isis CORE
  mpls ip
!
interface GigabitEthernet0/1
  description ### Link to RTM-P4 ###
  ip address 10.0.42.2 255.255.255.248
  no shutdown
  ip router isis CORE
  mpls ip
!
interface GigabitEthernet0/2
  description ### Link to RTM-P5 ###
  ip address 10.0.25.2 255.255.255.248
  no shutdown
  ip router isis CORE
  mpls ip
!
interface GigabitEthernet0/3
  description ### Link to RTM-P6 ###
  ip address 10.0.26.2 255.255.255.248
  no shutdown
  ip router isis CORE
  mpls ip
!
