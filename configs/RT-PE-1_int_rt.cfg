!
interface Loopback0
  description ### Loopback0 for BGP Router ID ###
  ip address 10.0.0.13 255.255.255.255
  no shutdown
  ip router isis CORE
!
interface GigabitEthernet0/0
  description ### Link to RT-P-5 ###
  ip address 10.0.51.1 255.255.255.248
  no shutdown
  ip router isis CORE
!
  mpls ip
!
interface GigabitEthernet0/1
  description ### Link to SW-CORE-1 ###
  ip address 10.1.3.6 255.255.255.248
  ip vrf forwarding VRF_green
  no shutdown
!
interface GigabitEthernet0/2
  description ### Link to SW-B2 ###
  ip address 10.1.5.6 255.255.255.248
  ip vrf forwarding VRF_blue
  no shutdown
!
