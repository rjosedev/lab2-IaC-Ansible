!
interface Loopback0
  description ### Loopback0 for BGP Router ID ###
  ip address 10.0.0.12 255.255.255.255
  no shutdown
  ip router isis CORE
!
interface GigabitEthernet0/0
  description ### Link to RT-P-4 ###
  ip address 10.0.24.2 255.255.255.248
  no shutdown
  ip router isis CORE
!
  mpls ip
!
interface GigabitEthernet0/1
  description ### Link to SW_CORE_2 ###
  ip address 10.1.2.6 255.255.255.248
  ip vrf forwarding VRF_green
  no shutdown
!
