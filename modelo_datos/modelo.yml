vars:
  sn_24: &sn_24 255.255.255.0
  sn_29: &sn_29 255.255.255.248
  sn_30: &sn_30 255.255.255.252
  sn_32: &sn_32 255.255.255.255
  sn_vl11: &sn_vl11 "172.16.11"
  sn_vl21: &sn_vl21 "172.16.21"
  sn_vl31: &sn_vl31 "172.16.31"
  sn_vl41: &sn_vl41 "172.31.41"
  sn_vl51: &sn_vl51 "10.0.51"
  sn_vl61: &sn_vl61 "10.0.61"
  sn_vl71: &sn_vl71 "10.0.71"
  sn_vl81: &sn_vl81 "10.0.81"
  fst_ip: &fst_ip ".250"
  snd_ip: &snd_ip ".251"
  lst_ip: &lst_ip ".254"
  networks: &networks
    - 172.16.11.0
    - 172.16.21.0
    - 172.16.31.0
    - 172.31.41.0 
    - 10.0.51.0
    - 10.0.61.0
    - 10.0.71.0
    - 10.0.81.0
  services: &services
    dns:
      server1: &server1 10.0.71.11
      server2: &server2 10.0.81.22
    ntp:
      server1: *server1
      server2: *server2
      source_int: &source_int Vlan5
    syslog:
      server1: *server1
      server2: *server2
      source_int: *source_int
    snmp:
      server1: *server1
      snmp_community: "{{ snmp_community }}"
      source_int: *source_int
  vlans: &sw_vlans
    - id: 1
      name: VLAN01_Default/Native
    - id: 3
      name: VLAN03_Routing/Mgmt
    - id: 5
      name: VLAN05_Mgmt/OOB
    - id: 11
      name: VLAN11_Engineering
    - id: 21
      name: VLAN21_Accounting
    - id: 31
      name: VLAN31_Production
    - id: 41
      name: VLAN41_DevOps
    - id: 51
      name: VLAN51_Data
    - id: 61
      name: VLAN61_Services
    - id: 71
      name: VLAN71_IT1
    - id: 81
      name: VLAN81_IT2
    - id: 99
      name: VLAN99_Unused/Suspended
  int_access: &int_access
    mode: access
    description: "### NONE at VLAN99_Unused/Suspended - ACCESS ###"
  int_trunk: &int_trunk
    allowed_vlan: 
    mode: trunk
    native: 1
    dynamic: null
    channel_group: null
    channel_mode: null
  int_svi: &int_svi
    sn_vl11: *sn_vl11
    sn_vl21: *sn_vl21
    sn_vl31: *sn_vl31
    sn_vl41: *sn_vl41
    sn_vl51: *sn_vl51
    sn_vl61: *sn_vl61
    sn_vl71: *sn_vl71
    sn_vl81: *sn_vl81
    fst_ip: ""
    snd_ip: ""
    lst_ip: *lst_ip
    subnet_mask: *sn_24
    vrrp_group: null
    vrrp_priority: null
    mode: svi
    vlan: null
    trunk_mode: null
    allowed_vlan: null
  int_mgmt: &int_mgmt
    mode: mgmt
    subnet_mask: *sn_24
  int_internet: &int_internet
    mode: internet
    subnet_mask: *sn_24
    description: "### Link to Internet Cloud 0 ###"
  int_isis: &int_isis
    mode: isis
    isis_name: CORE
    mpls_ip: null
  int_vrf: &int_vrf
    mode: vrf
    vrf_name: null
modelo:
  metadata:
    version: 1.0
    project: Simulacro de Caso de Uso - Lab 2 - IaC > Ansible
    description: Modelo de datos para la gestión de infraestructura de red
    author: Equipo de Desarrollo
    date: 2124-12-08
    time_zone: America/Argentina/Buenos_Aires
  hosts_groups:
    sw_all: cisco_ios_sw_all
    sw_core: cisco_ios_sw_core
    sw_bld: cisco_ios_sw_bld
    sw_dc: cisco_ios_sw_dc
    sw_it: cisco_ios_sw_it
    rt_all: cisco_ios_rt_all
    rt_p: cisco_ios_rt_p
    rt_pe: cisco_ios_rt_pe
  # Infrastructure inventory
  infra_spec:
    # Devices inventory
    devices:
      #### SW-CORE-1 ####
      SW-CORE-1:
        management:
          ip: 172.16.5.51
          interface: GigabitEthernet1/3
        ip_routing: true
        # EIGRP Routing configuration
        routers:
          - name: eigrp
            as_number: 11
            router_id: 1.1.1.1
            networks: *networks
            no_passive_interfaces: &no_passive_interfaces
              - GigabitEthernet1/1
              - GigabitEthernet1/2
              - GigabitEthernet2/1
              - GigabitEthernet2/2
        # Services configuration
        services: *services
        # VLANs database inventory
        vlans: *sw_vlans
        # Per VLAN Spanning Tree Protocol configurations
        pvst:
          - mode: rapid-pvst
            rt_pri: 11,31,51
            rt_sec: 21,41,61
        # Interfaces configurations
        interfaces:
          # ACCESS interfaces
          - name: GigabitEthernet0/0
            <<: *int_access
            access_vlan: 99
          # TRUNK interfaces
          - name: GigabitEthernet0/1
            description: "### Link to SW-BLD-A - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,11,21,31,41,51,61
          - name: GigabitEthernet0/2
            description: "### Link to SW-BLD-B - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,11,21,31,41,51,61
          - name: GigabitEthernet0/3
            description: "### Link to SW-DC - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,11,21,31,41,51,61
          - name: GigabitEthernet1/0
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet1/1
            description: "### Link 1 to SW-CORE-2 - LACP - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            channel_group: 1
            channel_mode: active
            allowed_vlan: 1,3,11,21,31,41,51,61
          - name: GigabitEthernet1/2
            description: "### Link 2 to SW-CORE-2 - LACP - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            channel_group: 1
            channel_mode: active
            allowed_vlan: 1,3,11,21,31,41,51,61
          - name: GigabitEthernet1/3
            description: "### Link to SW-MGMT-OOB - Uplinks to Net Cloud 1 - ACCESS ###"
            <<: *int_access
            access_vlan: 5
          - name: GigabitEthernet2/0
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet2/1
            description: "### Link to SW-IT-1 - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,3
          - name: GigabitEthernet2/2
            description: "### Link to SW-IT-2 - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,3
          #- name: GigabitEthernet2/3
          #  <<: *int_access
          #  access_vlan: 99
          # Port-Channel interfaces
          - name: Port-Channel1
            description: "### Port-Channel 1 (GE1/1 - GE1/2) to SW-CORE-2 - LACP - TRUNK ###"
            <<: *int_trunk
            port_channel: 1
            dynamic: desirable
            allowed_vlan: 1,3,11,21,31,41,51,61
          # SVI interface for MGMT
          - name: vlan 3
            vlan: 3
            ip_address: 172.16.3.31
            <<: *int_mgmt
          - name: vlan 5
            vlan: 5
            ip_address: 172.16.5.51
            <<: *int_mgmt
          # SVI interfaces for VLANs routing configured with VRRP
          - name: vlan 11
            vlan: 11
            ip_address: *sn_vl11
            fst_ip: *fst_ip
            description: "### SVI interface for VLAN11_Engineering ###"
            vrrp_group: 11
            vrrp_priority: 1
            <<: *int_svi
          - name: vlan 21
            vlan: 21
            ip_address: *sn_vl21
            fst_ip: *fst_ip
            description: "### SVI interface for VLAN21_Accounting ###"
            vrrp_group: 21
            vrrp_priority: 2
            <<: *int_svi
          - name: vlan 31
            vlan: 31
            ip_address: *sn_vl31
            fst_ip: *fst_ip
            description: "### SVI interface for VLAN31_Production ###"
            <<: *int_svi
            vrrp_group: 31
            vrrp_priority: 1
          - name: vlan 41
            vlan: 41
            ip_address: *sn_vl41
            fst_ip: *fst_ip
            description: "### SVI interface for VLAN41_DevOps ###"
            vrrp_group: 41
            vrrp_priority: 2
            <<: *int_svi
          - name: vlan 51
            vlan: 51
            ip_address: *sn_vl51
            fst_ip: *fst_ip
            description: "### SVI interface for VLAN51_Data ###"
            vrrp_group: 51
            vrrp_priority: 1
            <<: *int_svi
          - name: vlan 61
            vlan: 61
            ip_address: *sn_vl61
            fst_ip: *fst_ip
            description: "### SVI interface for VLAN61_Services ###"
            vrrp_group: 61
            vrrp_priority: 2
            <<: *int_svi
      #### EOF SW-CORE-1 ####

      #### SW-CORE-2 ####
      SW-CORE-2:
        management:
          ip: 172.16.5.52
          interface: GigabitEthernet1/3
        ip_routing: true
        routers:
          - name: eigrp
            as_number: 11
            router_id: 1.1.1.2
            networks: *networks
            no_passive_interfaces: *no_passive_interfaces
        services: *services
        vlans: *sw_vlans
        pvst:
          - mode: rapid-pvst
            rt_pri: 21,41,61
            rt_sec: 11,31,51
        interfaces:
          - name: GigabitEthernet0/0
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet0/1
            description: "### Link to SW-BLD-A - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,11,21,31,41,51,61
          - name: GigabitEthernet0/2
            description: "### Link to SW-BLD-B - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,11,21,31,41,51,61
          - name: GigabitEthernet0/3
            description: "### Link to SW-DC - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,11,21,31,41,51,61
          - name: GigabitEthernet1/0
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet1/1
            description: "### Link 1 to SW-CORE-1 - LACP - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            channel_group: 1
            channel_mode: active
            allowed_vlan: 1,3,11,21,31,41,51,61
          - name: GigabitEthernet1/2
            description: "### Link 2 to SW-CORE-1 - LACP - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            channel_group: 1
            channel_mode: active
            allowed_vlan: 1,3,11,21,31,41,51,61
          - name: GigabitEthernet1/3
            description: "### Link to SW-MGMT-OOB - Uplinks to Net Cloud 1 - ACCESS ###"
            <<: *int_access
            access_vlan: 5
          - name: GigabitEthernet2/0
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet2/1
            description: "### Link to SW-IT-1 - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
