            <<: *int_trunk
            port_channel: 1
            dynamic: desirable
            allowed_vlan: 1,3,11,21,31,41,51,61
          - name: vlan 3
            vlan: 3
            ip_address: 172.16.3.32
            <<: *int_mgmt
          - name: vlan 5
            vlan: 5
            ip_address: 172.16.5.52
            <<: *int_mgmt
          - name: vlan 11
            vlan: 11
            ip_address: *sn_vl11
            snd_ip: *snd_ip
            description: "### SVI interface for VLAN11_Engineering ###"
            vrrp_group: 11
            vrrp_priority: 2
            <<: *int_svi
          - name: vlan 21
            vlan: 21
            ip_address: *sn_vl21
            snd_ip: *snd_ip
            description: "### SVI interface for VLAN21_Accounting ###"
            vrrp_group: 21
            vrrp_priority: 1
            <<: *int_svi
          - name: vlan 31
            vlan: 31
            ip_address: *sn_vl31
            snd_ip: *snd_ip
            description: "### SVI interface for VLAN31_Production ###"
            vrrp_group: 31
            vrrp_priority: 2
            <<: *int_svi
          - name: vlan 41
            vlan: 41
            ip_address: *sn_vl41
            snd_ip: *snd_ip
            description: "### SVI interface for VLAN41_DevOps ###"
            vrrp_group: 41
            vrrp_priority: 1
            <<: *int_svi
          - name: vlan 51
            vlan: 51
            ip_address: *sn_vl51
            snd_ip: *snd_ip
            description: "### SVI interface for VLAN51_Data ###"
            vrrp_group: 51
            vrrp_priority: 2
            <<: *int_svi
          - name: vlan 61
            vlan: 61
            ip_address: *sn_vl61
            snd_ip: *snd_ip
            description: "### SVI interface for VLAN61_Services ###"
            vrrp_group: 61
            vrrp_priority: 1
            <<: *int_svi
      #### EOF SW-CORE-2 ####

      #### SW-BLD-A ####
      SW-BLD-A:
        management:
          ip: 172.16.5.53
          interface: GigabitEthernet1/3
        ip_routing: false
        services: *services
        vlans: *sw_vlans
        pvst:
          - mode: rapid-pvst
        interfaces:
          - name: GigabitEthernet0/0
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet0/1
            description: "### Link to SW-CORE-1 - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,11,21,31,41,51,61
          - name: GigabitEthernet0/2
            description: "### Link to SW-CORE-2 - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,11,21,31,41,51,61
          - name: GigabitEthernet0/3
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet1/0
            description: "### Link to PC on VLAN11_Engineering - ACCESS ###"
            <<: *int_access
            access_vlan: 11
          - name: GigabitEthernet1/1
            description: "### Link to PC on VLAN21_Accounting - ACCESS ###"
            <<: *int_access
            access_vlan: 21
          - name: GigabitEthernet1/2
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet1/3
            description: "### Link to SW-MGMT-OOB - Uplinks to Net Cloud 1 - ACCESS ###"
