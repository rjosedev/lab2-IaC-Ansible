        ip_routing: false
        services: *services
        vlans: *sw_vlans
        pvst:
          - mode: rapid-pvst
        interfaces:
          - name: GigabitEthernet0/0
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet0/1
            description: "### Link to SW-CORE-1 - TRUNK ###"
            <<: *int_trunk
