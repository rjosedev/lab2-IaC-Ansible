            <<: *int_trunk
            allowed_vlan: 1,70,80
          - name: GigabitEthernet0/2
            description: "### Link 2 to (e4/ens7) UBUNTU-1 - TRUNK ###"
            <<: *int_trunk
            allowed_vlan: 1,70,80
          - name: GigabitEthernet0/3
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet1/0
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet1/1
            description: "### Link 1 to SW-IT-1 - LACP - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            channel_group: 1
            channel_mode: active
            allowed_vlan: 1,3,70,80
          - name: GigabitEthernet1/2
            description: "### Link 2 to SW-IT-1 - LACP - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            channel_group: 1
            channel_mode: active
