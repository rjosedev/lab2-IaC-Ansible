          - name: GigabitEthernet0/3
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet1/0
            description: "### Link to PC on VLAN30_Production - ACCESS ###"
            <<: *int_access
            access_vlan: 30
          - name: GigabitEthernet1/1
            description: "### Link to PC on VLAN40_DevOps - ACCESS ###"
            <<: *int_access
            access_vlan: 40
          - name: GigabitEthernet1/2
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet1/3
            description: "### Link to SW-MGMT-OOB - Uplinks to NetCloud 1 - ACCESS ###"
            <<: *int_access
