vars:
  sn_24: &sn_24 255.255.255.0
  source_int: &source_int Vlan5
  sn_vl10: &sn_vl10 172.16.10
  sn_vl20: &sn_vl20 172.16.20
  sn_vl30: &sn_vl30 172.16.30
  sn_vl40: &sn_vl40 172.31.40
  sn_vl50: &sn_vl50 10.0.50
  sn_vl60: &sn_vl60 10.0.60
  sn_vl70: &sn_vl70 10.0.70
  sn_vl80: &sn_vl80 10.0.80
  fst_ip: &fst_ip .250
  snd_ip: &snd_ip .251
  lst_ip: &lst_ip .254
  networks: &networks
    - 172.16.10.0
    - 172.16.20.0
    - 172.16.30.0
    - 172.31.40.0
    - 10.0.50.0
    - 10.0.60.0
    - 10.0.70.0
    - 10.0.80.0
  services: &services
    - name: dns
      server1: 10.0.70.11
      server2: 10.0.80.22
    - name: ntp
      server1: 10.0.70.11
      server2: 10.0.80.22
      source_int: *source_int
    - name: syslog
      server1: 10.0.70.11
      server2: 10.0.80.22
      source_int: *source_int
    - name: snmp
      server1: 10.0.70.11
      snmp_community: "{{ snmp_community }}"
      source_int: *source_int
  vlans: &sw_vlans
    - id: 1
      name: VLAN01_Default/Native
    - id: 3
      name: VLAN03_Routing/Mgmt
    - id: 5
      name: VLAN05_Mgmt/OOB
    - id: 10
      name: VLAN10_Engineering
    - id: 20
      name: VLAN20_Accounting
    - id: 30
      name: VLAN30_Production
    - id: 40
      name: VLAN40_DevOps
    - id: 50
      name: VLAN50_Data
    - id: 60
      name: VLAN60_Services
    - id: 70
      name: VLAN70_IT1
    - id: 80
      name: VLAN80_IT2
    - id: 99
      name: VLAN99_Unused/Suspended
  int_access: &int_access
    mode: access
    description: "### NONE at VLAN99_Unused/Suspended - ACCESS ###"
  int_trunk: &int_trunk
    allowed_vlan: 
    mode: trunk
    native: 1
    dynamic: null
    channel_group: null
    channel_mode: null
  int_svi: &int_svi
    sn_vl10: *sn_vl10
    sn_vl20: *sn_vl20
    sn_vl30: *sn_vl30
    sn_vl40: *sn_vl40
    sn_vl50: *sn_vl50
    sn_vl60: *sn_vl60
    sn_vl70: *sn_vl70
    sn_vl80: *sn_vl80
    fst_ip: null
    snd_ip: null
    lst_ip: *lst_ip
    subnet_mask: *sn_24
    vrrp_group: null
    vrrp_priority: null
    mode: svi
    vlan: null
    trunk_mode: null
    allowed_vlan: null
  int_mgmt: &int_mgmt
    mode: mgmt
    subnet_mask: *sn_24
modelo:
  metadata:
    version: 1.0
    project: Simulacro de Caso de Uso - Lab 2 - IaC > Ansible
    description: Modelo de datos para la gestión de infraestructura de red
    author: Equipo de Desarrollo
    date: 2024-12-08
    time_zone: America/Argentina/Buenos_Aires
  hosts_groups:
    sw_all: cisco_ios_sw_all
    sw_core: cisco_ios_sw_core
    sw_bld: cisco_ios_sw_bld
    sw_dc: cisco_ios_sw_dc
    sw_it: cisco_ios_sw_it
  # Infrastructure inventory
  infra_spec:
    # Devices inventory
    devices:
      #### SW-CORE-1 ####
      SW-CORE-1:
        management:
          ip: 172.16.5.51
          interface: GigabitEthernet1/3
        ip_routing: true
        # EIGRP Routing configuration
        routers:
          - name: eigrp
            as_number: 10
            router_id: 1.1.1.1
            networks: *networks
            no_passive_interfaces: &no_passive_interfaces
              - GigabitEthernet1/1
              - GigabitEthernet1/2
              - GigabitEthernet2/1
              - GigabitEthernet2/2
        # Services configuration
        services: *services
        # VLANs database inventory
        vlans: *sw_vlans
        # Per VLAN Spanning Tree Protocol configurations
        pvst:
          - mode: rapid-pvst
            rt_pri: 10,30,50
            rt_sec: 20,40,60
        # Interfaces configurations
        interfaces:
          # ACCESS interfaces
          - name: GigabitEthernet0/0
            <<: *int_access
            access_vlan: 99
          # TRUNK interfaces
          - name: GigabitEthernet0/1
            description: "### Link to SW-BLD-A - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,10,20,30,40,50,60
          - name: GigabitEthernet0/2
            description: "### Link to SW-BLD-B - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,10,20,30,40,50,60
          - name: GigabitEthernet0/3
            description: "### Link to SW-DC - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,10,20,30,40,50,60
          - name: GigabitEthernet1/0
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet1/1
            description: "### Link 1 to SW-CORE-2 - LACP - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            channel_group: 1
            channel_mode: active
            allowed_vlan: 1,3,10,20,30,40,50,60
          - name: GigabitEthernet1/2
            description: "### Link 2 to SW-CORE-2 - LACP - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            channel_group: 1
            channel_mode: active
            allowed_vlan: 1,3,10,20,30,40,50,60
          - name: GigabitEthernet1/3
            description: "### Link to SW-MGMT-OOB - Uplinks to NetCloud 1 - ACCESS ###"
            <<: *int_access
            access_vlan: 5
          - name: GigabitEthernet2/0
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet2/1
            description: "### Link to SW-IT-1 - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,3
          - name: GigabitEthernet2/2
            description: "### Link to SW-IT-2 - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,3
          - name: GigabitEthernet2/3
            <<: *int_access
            access_vlan: 99
          # Port-Channel interfaces
          - name: Port-Channel1
            description: "### Port-Channel 1 (GE1/1 - GE1/2) to SW-CORE-2 - LACP - TRUNK ###"
            <<: *int_trunk
            port_channel: 1
            dynamic: desirable
            allowed_vlan: 1,3,10,20,30,40,50,60
          # SVI interface for MGMT
          - name: vlan 3
            vlan: 3
            ip_address: 172.16.3.31
            <<: *int_mgmt
          - name: vlan 5
            vlan: 5
            ip_address: 172.16.5.51
            <<: *int_mgmt
          # SVI interfaces for VLANs routing configured with VRRP
          - name: vlan 10
            vlan: 10
            ip_address: *sn_vl10
            fst_ip: *fst_ip
            description: "### SVI interface for VLAN10_Engineering ###"
            vrrp_group: 10
            vrrp_priority: 1
            <<: *int_svi
          - name: vlan 20
            vlan: 20
            ip_address: *sn_vl20
            fst_ip: *fst_ip
            description: "### SVI interface for VLAN20_Accounting ###"
            vrrp_group: 20
            vrrp_priority: 2
            <<: *int_svi
          - name: vlan 30
            vlan: 30
            ip_address: *sn_vl30
            fst_ip: *fst_ip
            description: "### SVI interface for VLAN30_Production ###"
            <<: *int_svi
            vrrp_group: 30
            vrrp_priority: 1
          - name: vlan 40
            vlan: 40
            ip_address: *sn_vl40
            fst_ip: *fst_ip
            description: "### SVI interface for VLAN40_DevOps ###"
            vrrp_group: 40
            vrrp_priority: 2
            <<: *int_svi
          - name: vlan 50
            vlan: 50
            ip_address: *sn_vl50
            fst_ip: *fst_ip
            description: "### SVI interface for VLAN50_Data ###"
            vrrp_group: 50
            vrrp_priority: 1
            <<: *int_svi
          - name: vlan 60
            vlan: 60
            ip_address: *sn_vl60
            fst_ip: *fst_ip
            description: "### SVI interface for VLAN60_Services ###"
            vrrp_group: 60
            vrrp_priority: 2
            <<: *int_svi
      #### EOF SW-CORE-1 ####

      #### SW-CORE-2 ####
      SW-CORE-2:
        management:
          ip: 172.16.5.52
          interface: GigabitEthernet1/3
        ip_routing: true
        routers:
          - name: eigrp
            as_number: 10
            router_id: 1.1.1.2
            networks: *networks
            no_passive_interfaces: *no_passive_interfaces
        services: *services
        vlans: *sw_vlans
        pvst:
          - mode: rapid-pvst
            rt_pri: 20,40,60
            rt_sec: 10,30,50
        interfaces:
          - name: GigabitEthernet0/0
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet0/1
            description: "### Link to SW-BLD-A - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,10,20,30,40,50,60
          - name: GigabitEthernet0/2
            description: "### Link to SW-BLD-B - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,10,20,30,40,50,60
          - name: GigabitEthernet0/3
            description: "### Link to SW-DC - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,10,20,30,40,50,60
          - name: GigabitEthernet1/0
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet1/1
            description: "### Link 1 to SW-CORE-1 - LACP - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            channel_group: 1
            channel_mode: active
            allowed_vlan: 1,3,10,20,30,40,50,60
          - name: GigabitEthernet1/2
            description: "### Link 2 to SW-CORE-1 - LACP - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            channel_group: 1
            channel_mode: active
            allowed_vlan: 1,3,10,20,30,40,50,60
          - name: GigabitEthernet1/3
            description: "### Link to SW-MGMT-OOB - Uplinks to NetCloud 1 - ACCESS ###"
            <<: *int_access
            access_vlan: 5
          - name: GigabitEthernet2/0
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet2/1
            description: "### Link to SW-IT-1 - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,3
          - name: GigabitEthernet2/2
            description: "### Link to SW-IT-2 - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,3          
          - name: GigabitEthernet2/3
            <<: *int_access
            access_vlan: 99
          - name: Port-Channel1
            description: "### Port-Channel 1 (GE1/1 - GE1/2) to SW-CORE-1 - LACP - TRUNK ###"
            <<: *int_trunk
            port_channel: 1
            dynamic: desirable
            allowed_vlan: 1,3,10,20,30,40,50,60
          - name: vlan 3
            vlan: 3
            ip_address: 172.16.3.32
            <<: *int_mgmt
          - name: vlan 5
            vlan: 5
            ip_address: 172.16.5.52
            <<: *int_mgmt
          - name: vlan 10
            vlan: 10
            ip_address: *sn_vl10
            snd_ip: *snd_ip
            description: "### SVI interface for VLAN10_Engineering ###"
            vrrp_group: 10
            vrrp_priority: 2
            <<: *int_svi
          - name: vlan 20
            vlan: 20
            ip_address: *sn_vl20
            snd_ip: *snd_ip
            description: "### SVI interface for VLAN20_Accounting ###"
            vrrp_group: 20
            vrrp_priority: 1
            <<: *int_svi
          - name: vlan 30
            vlan: 30
            ip_address: *sn_vl30
            snd_ip: *snd_ip
            description: "### SVI interface for VLAN30_Production ###"
            vrrp_group: 30
            vrrp_priority: 2
            <<: *int_svi
          - name: vlan 40
            vlan: 40
            ip_address: *sn_vl40
            snd_ip: *snd_ip
            description: "### SVI interface for VLAN40_DevOps ###"
            vrrp_group: 40
            vrrp_priority: 1
            <<: *int_svi
          - name: vlan 50
            vlan: 50
            ip_address: *sn_vl50
            snd_ip: *snd_ip
            description: "### SVI interface for VLAN50_Data ###"
            vrrp_group: 50
            vrrp_priority: 2
            <<: *int_svi
          - name: vlan 60
            vlan: 60
            ip_address: *sn_vl60
            snd_ip: *snd_ip
            description: "### SVI interface for VLAN60_Services ###"
            vrrp_group: 60
            vrrp_priority: 1
            <<: *int_svi
      #### EOF SW-CORE-2 ####

      #### SW-BLD-A ####
      SW-BLD-A:
        management:
          ip: 172.16.5.53
          interface: GigabitEthernet1/3
        ip_routing: false
        services: *services
        vlans: *sw_vlans
        pvst:
          - mode: rapid-pvst
        interfaces:
          - name: GigabitEthernet0/0
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet0/1
            description: "### Link to SW-CORE-1 - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,10,20,30,40,50,60
          - name: GigabitEthernet0/2
            description: "### Link to SW-CORE-2 - TRUNK ###"
            <<: *int_trunk
            dynamic: desirable
            allowed_vlan: 1,10,20,30,40,50,60
          - name: GigabitEthernet0/3
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet1/0
            description: "### Link to PC on VLAN10_Engineering - ACCESS ###"
            <<: *int_access
            access_vlan: 10
          - name: GigabitEthernet1/1
            description: "### Link to PC on VLAN20_Accounting - ACCESS ###"
            <<: *int_access
            access_vlan: 20
          - name: GigabitEthernet1/2
            <<: *int_access
            access_vlan: 99
          - name: GigabitEthernet1/3
            description: "### Link to SW-MGMT-OOB - Uplinks to NetCloud 1 - ACCESS ###"
            <<: *int_access
            access_vlan: 5          
          - name: vlan 5
            vlan: 5
            ip_address: 172.16.5.53
            <<: *int_mgmt
      #### EOF SW-BLD-A ####

      #### SW-BLD-B ####
